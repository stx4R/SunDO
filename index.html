<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- W-19 — `favicon.ico`(64×64)를 **임시로** 쓴다(사용자 결정).
         `favicon.svg`는 팔레트 밖(#863bff)이라 참조하지 않는다. -->
    <link rel="icon" href="/favicon.ico" sizes="64x64" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- §7.1 --bg-top. manifest의 theme_color·background_color와 같은 값이다. -->
    <meta name="theme-color" content="#F7FBF8" />
    <!-- PRD §18.2 iOS 메타. `display: standalone`만으로는 iOS가 홈 화면 실행을
         전체 화면으로 띄우지 않는다 — 이 줄이 그 역할을 한다.
         🔴 `mobile-web-app-capable`은 발명이 아니라 **실측으로 잡힌 것**이다. Chrome 151이
         콘솔에 그대로 경고한다: `<meta name="apple-mobile-web-app-capable" content="yes"> is
         deprecated. Please include <meta name="mobile-web-app-capable" content="yes">`.
         §18.2가 적은 옛 이름을 지우지 않고 표준 이름을 **함께** 둔다(보고서 §4). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- §18.3 3단계가 「홈 화면의 `자율생활부` 아이콘으로 실행합니다」라고 적는다.
         이 줄이 없으면 iOS가 `<title>`(= `SunDO`)를 아이콘 이름으로 쓴다 —
         값은 §18.2의 `short_name`에서 그대로 가져왔고 새로 지은 문자열이 아니다. -->
    <meta name="apple-mobile-web-app-title" content="자율생활부" />
    <!-- PRD §18.2. 값의 출처는 `public/manifest.webmanifest` 옆 주석이 아니라
         보고서 `reports/W-19.md` §2다 — `.webmanifest`는 JSON이라 주석을 담지 못한다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SunDO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
