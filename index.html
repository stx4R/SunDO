<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- W-19 — `favicon.ico`(64×64)를 **임시로** 쓴다(사용자 결정).
         `favicon.svg`는 팔레트 밖(#863bff)이라 참조하지 않는다. -->
    <link rel="icon" href="/favicon.ico" sizes="64x64" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!-- 🔴 **W-23 B-9(b)(B-09) — `maximum-scale`·`user-scalable`이 여기서 붙었다(PM 확정: 핀치까지 차단).**
         🔴 **이것은 W-03A DoD 6(「`maximum-scale`·`user-scalable` 부재 0건」 · §15 접근성 조치)을
         폐기하는 결정이다.** 사용자가 명시 요구했고, 보고서 `reports/W-23.md` §3에 폐기 사실과
         근거를 적었다.
         🔴 **대체 접근성 경로가 살아 있다** — AC-05가 루트 글꼴을 고정하지 않아(`index.css` §7.2 주석)
         시스템 글자 크기 설정이 그대로 앱 전체를 키운다. 32px 루트·200%에서 가로 스크롤 0임을
         W-15B §4-7이 실측했다. 저시력 사용자가 완전히 막히지는 않는다.
         ⚠ iOS Safari는 iOS 10부터 이 두 값을 **무시한다.** 핀치는 `src/lib/zoom.ts`의
         `gesturestart` 차단이 맡고, 더블탭 줌은 `body { touch-action: manipulation }`이 맡는다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- §7.1 --bg-top. manifest의 theme_color·background_color와 같은 값이다. -->
    <meta name="theme-color" content="#F7FBF8" />
    <!-- PRD §18.2 iOS 메타. `display: standalone`만으로는 iOS가 홈 화면 실행을
         전체 화면으로 띄우지 않는다 — 이 줄이 그 역할을 한다.
         🔴 `mobile-web-app-capable`은 발명이 아니라 **실측으로 잡힌 것**이다. Chrome 151이
         콘솔에 그대로 경고한다: `<meta name="apple-mobile-web-app-capable" content="yes"> is
         deprecated. Please include <meta name="mobile-web-app-capable" content="yes">`.
         §18.2가 적은 옛 이름을 지우지 않고 표준 이름을 **함께** 둔다(보고서 §4). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 🔴 **W-25 A-1 — `default` → `black-translucent`.**
         `default`은 웹뷰를 상태 표시줄 **아래**에서 시작시키므로 그 띠는 `body`의
         배경**색** 한 겹으로만 칠해진다. 스테이지 그라디언트도 좌상단 aura 블롭의
         초록 틴트도 그 띠에는 닿지 않아 **이음매**가 남았다(첨부1).
         `black-translucent`는 웹뷰를 화면 맨 위에서 시작시켜 **배경 자체가 그 자리를
         칠한다** — 사용자가 요구한 「배경만 연장」이 정확히 이 값이다.

         🔴 **UI는 따라 올라가지 않는다.** `viewport-fit=cover`가 이미 있고
         `AppShell`이 상단 패딩에 `env(safe-area-inset-top)`을 더한다(그 계약은
         W-10 이후 diff 0줄이다). 토스트·오프라인 배너도 같은 함수를 쓴다.

         ⚠ **대가 — 상태 표시줄 글자가 흰색으로 고정된다.** 밝은 배경(#F7FBF8) 위에서
         시계·배터리가 거의 안 보인다. 🔴 **이것은 W-23 A-1의 결정을 뒤집는 것이고,
         사용자가 그 대가를 알고 확정했다**(보고서 §2 결정 1). 되돌리기는 이 한 줄을
         `default`로 되돌리면 끝난다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- §18.3 3단계가 「홈 화면의 `자율생활부` 아이콘으로 실행합니다」라고 적는다.
         이 줄이 없으면 iOS가 `<title>`(= `SunDO`)를 아이콘 이름으로 쓴다 —
         값은 §18.2의 `short_name`에서 그대로 가져왔고 새로 지은 문자열이 아니다. -->
    <meta name="apple-mobile-web-app-title" content="자율생활부" />
    <!-- PRD §18.2. 값의 출처는 `public/manifest.webmanifest` 옆 주석이 아니라
         보고서 `reports/W-19.md` §2다 — `.webmanifest`는 JSON이라 주석을 담지 못한다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SunDO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
