<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- W-19 — `favicon.ico`(64×64)를 **임시로** 쓴다(사용자 결정).
         `favicon.svg`는 팔레트 밖(#863bff)이라 참조하지 않는다. -->
    <link rel="icon" href="/favicon.ico" sizes="64x64" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!-- 🔴 **W-23 B-9(b)(B-09) — `maximum-scale`·`user-scalable`이 여기서 붙었다(PM 확정: 핀치까지 차단).**
         🔴 **이것은 W-03A DoD 6(「`maximum-scale`·`user-scalable` 부재 0건」 · §15 접근성 조치)을
         폐기하는 결정이다.** 사용자가 명시 요구했고, 보고서 `reports/W-23.md` §3에 폐기 사실과
         근거를 적었다.
         🔴 **대체 접근성 경로가 살아 있다** — AC-05가 루트 글꼴을 고정하지 않아(`index.css` §7.2 주석)
         시스템 글자 크기 설정이 그대로 앱 전체를 키운다. 32px 루트·200%에서 가로 스크롤 0임을
         W-15B §4-7이 실측했다. 저시력 사용자가 완전히 막히지는 않는다.
         ⚠ iOS Safari는 iOS 10부터 이 두 값을 **무시한다.** 핀치는 `src/lib/zoom.ts`의
         `gesturestart` 차단이 맡고, 더블탭 줌은 `body { touch-action: manipulation }`이 맡는다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <!-- §7.1 --bg-top. manifest의 theme_color·background_color와 같은 값이다. -->
    <meta name="theme-color" content="#F7FBF8" />
    <!-- PRD §18.2 iOS 메타. `display: standalone`만으로는 iOS가 홈 화면 실행을
         전체 화면으로 띄우지 않는다 — 이 줄이 그 역할을 한다.
         🔴 `mobile-web-app-capable`은 발명이 아니라 **실측으로 잡힌 것**이다. Chrome 151이
         콘솔에 그대로 경고한다: `<meta name="apple-mobile-web-app-capable" content="yes"> is
         deprecated. Please include <meta name="mobile-web-app-capable" content="yes">`.
         §18.2가 적은 옛 이름을 지우지 않고 표준 이름을 **함께** 둔다(보고서 §4). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 🔴 **W-25 A-1 — `default` → `black-translucent`.**
         `default`은 웹뷰를 상태 표시줄 **아래**에서 시작시키므로 그 띠는 `body`의
         배경**색** 한 겹으로만 칠해진다. 스테이지 그라디언트도 좌상단 aura 블롭의
         초록 틴트도 그 띠에는 닿지 않아 **이음매**가 남았다(첨부1).
         `black-translucent`는 웹뷰를 화면 맨 위에서 시작시켜 **배경 자체가 그 자리를
         칠한다** — 사용자가 요구한 「배경만 연장」이 정확히 이 값이다.

         🔴 **UI는 따라 올라가지 않는다.** `viewport-fit=cover`가 이미 있고
         `AppShell`이 상단 패딩에 `env(safe-area-inset-top)`을 더한다(그 계약은
         W-10 이후 diff 0줄이다). 토스트·오프라인 배너도 같은 함수를 쓴다.

         ⚠ **대가 — 상태 표시줄 글자가 흰색으로 고정된다.** 밝은 배경(#F7FBF8) 위에서
         시계·배터리가 거의 안 보인다. 🔴 **이것은 W-23 A-1의 결정을 뒤집는 것이고,
         사용자가 그 대가를 알고 확정했다**(보고서 §2 결정 1). 되돌리기는 이 한 줄을
         `default`로 되돌리면 끝난다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- §18.3 3단계가 「홈 화면의 `자율생활부` 아이콘으로 실행합니다」라고 적는다.
         이 줄이 없으면 iOS가 `<title>`(= `SunDO`)를 아이콘 이름으로 쓴다 —
         값은 §18.2의 `short_name`에서 그대로 가져왔고 새로 지은 문자열이 아니다. -->
    <meta name="apple-mobile-web-app-title" content="자율생활부" />
    <!-- PRD §18.2. 값의 출처는 `public/manifest.webmanifest` 옆 주석이 아니라
         보고서 `reports/W-19.md` §2다 — `.webmanifest`는 JSON이라 주석을 담지 못한다. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ============================================================
         🔴 **W-27 — 첫 왕복을 앞당기는 두 묶음. 여기 있는 것은 전부 「먼저 시작시키는」
         지시일 뿐이고, 받아 오는 바이트나 화면 결과를 바꾸지 않는다.**

         ① **preconnect — Firebase 3개 출처.**
         옛 순서는 「HTML → CSS·JS 내려받기 → 1.1 MB 파싱 → 그제서야 TLS 핸드셰이크」였다.
         DNS + TCP + TLS는 첫 조회 앞에 통째로 붙는 대기이고, 폰의 모바일망에서
         200~400 ms다. 이 줄들이 **파싱과 동시에** 그 핸드셰이크를 시작시킨다.
         🔴 **`crossorigin`이 없으면 소용이 없다** — Firebase 호출은 전부 CORS 요청이라
         자격 증명 모드가 다른 소켓은 **재사용되지 않는다.** 지우지 마라.
         ⚠ `securetoken`이 셋 중 가장 자주 쓰인다 — ID 토큰이 1시간마다 만료되므로
         **거의 모든 콜드 실행이 Firestore를 만지기 전에 여기를 한 번 거친다.**
         ⚠ 출처가 환경 변수와 무관한 **Google 고정 도메인**이라 하드코딩이 맞다.
         `authDomain`(프로젝트별)은 여기 넣을 수 없어 뺐다.

         ② **dns-prefetch — reCAPTCHA 2개 출처(App Check).**
         `lib/firebase.ts`가 초기화 시점에 reCAPTCHA 스크립트를 받는다. 첫 페인트를
         막지는 않아 preconnect까지 쓰지 않고 **DNS만** 미리 푼다 — 소켓을 셋이나
         더 잡아 진짜 급한 셋과 경쟁시키지 않기 위해서다.
         ============================================================ -->
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />

    <!-- 🔴 **W-27 — 실제로 쓰이는 굵기 3종만 미리 받는다.**
         `@font-face`는 `index.css` 안에 있어서, 브라우저가 그 존재를 알려면
         **CSS를 받아 파싱하고 → 글자를 배치해 어느 face가 필요한지 판정**해야 한다.
         그 두 단계가 끝난 뒤에야 요청이 나가고, 그동안 화면은 폴백 글꼴로 그려졌다가
         **나중에 갈아 끼워진다**(`font-display: swap`). 그 교체가 눈에 보이는 흔들림이다.
         이 줄들은 두 단계를 건너뛰고 CSS와 **동시에** 요청을 시작시킨다.

         🔴 **`crossorigin` 없이는 요청이 두 번 나간다.** 같은 출처라도 글꼴 요청은
         언제나 익명 CORS 모드라, 이 속성이 없으면 preload가 담아 둔 응답을
         `@font-face`가 재사용하지 못하고 **똑같은 파일을 한 번 더 받는다.**
         ⚠ 3종뿐인 이유는 `index.css` 머리 주석에 있다 — Thin·Light는 W-27이 지웠다.
         ⚠ 재실행에서는 서비스 워커 캐시에 이미 있어 이 요청들은 네트워크로 나가지 않는다. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/SpoqaHanSansNeo-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/SpoqaHanSansNeo-Medium.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/SpoqaHanSansNeo-Bold.woff2" />

    <title>SunDO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
